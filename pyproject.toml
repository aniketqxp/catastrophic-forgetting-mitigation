[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catastrophic-forgetting-mitigation"
version = "0.1.0"
authors = [
  { name="Aniket Shinde" },
]
description = "Mitigation of catastrophic forgetting in neural networks using various continual learning techniques."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "torch==2.0.0",
    "torchvision==0.15.0",
    "matplotlib==3.7.1",
    "numpy==1.24.3",
    "pandas==2.0.2",
    "tqdm==4.65.0",
]

[project.urls]
"Homepage" = "https://github.com/aniketqxp/catastrophic-forgetting-mitigation"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
